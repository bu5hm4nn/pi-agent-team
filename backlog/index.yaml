dependencies:
  edges:
    - "02 -> 01 — a punch URI has nothing to join until the transport exists"
    - "03 -> 01 — conformance coverage follows the implementation"
    - "05 -> 04 — a TTL is applied where the digest is composed"
    - "06 -> 01 — the handshake rides the transport"
    - "07a -> 01, 02 — the transport and punch URI must exist before they are documented"
    - "07b -> 04, 05 — delivery modes and the max age must exist before they are documented"
    - "08 -> 02 — provisioning hands out the punch URI"
    - "09 -> 01, 02 — a session can only hold many rooms once one room works serverless"
    - "10 -> 09 — room-scoped tools need the room registry"
    - "11 -> 06, 09 — isolation is asserted against the token gate and the registry"
    - "19 -> 13, 01, 02, 03, 06, 07a, 08 — the stack above i18n localizes the Phase 1 additions"
    - "14 -> 13 — the index.ts UI sinks call t()"
    - "15 -> 14 — dispatch output shares the catalog with the UI"
    - "16 -> 15 — session, config and transport errors share the same catalog"
    - "17 -> 13, 14, 15, 16 — the en-US catalog must cover every extracted key"
    - "18 -> 17 — help/description localization and /team lang land after the catalog is bilingual"
  verification_prerequisites:
    - "01, 02, 03, 06 and 11 need two reachable nodes for a live check; the conformance suite is the in-repo substitute for cross-network tests and must pass before any live claim."

